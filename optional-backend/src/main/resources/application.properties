spring.application.name=scamshield-backend
server.port=8080
# Origins allowed to call the API from a browser (comma separated).
scamshield.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000
# Never leak internal details in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Message text is never logged by this app; keep request logging quiet too.
logging.level.org.springframework.web=WARN
